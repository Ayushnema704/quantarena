apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-validator
  labels:
    app: validator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validator
  template:
    metadata:
      labels:
        app: validator
    spec:
      containers:
        - name: validator
          image: {{ .Values.image.validator }}
          env:
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
