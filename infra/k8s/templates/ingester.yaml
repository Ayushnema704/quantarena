apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-ingester
  labels:
    app: ingester
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: ingester
  template:
    metadata:
      labels:
        app: ingester
    spec:
      containers:
        - name: ingester
          image: {{ .Values.image.ingester }}
          env:
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: DATABASE_URL
              value: {{ .Values.timescaledb.url | quote }}
            - name: DROP_POLICY
              value: drop_oldest
            - name: METRICS_PORT
              value: "9100"
          ports:
            - containerPort: 9100
              name: metrics
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ingester
  labels:
    app: ingester
spec:
  ports:
    - port: 9100
      targetPort: 9100
      name: metrics
  selector:
    app: ingester
