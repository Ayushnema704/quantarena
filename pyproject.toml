[project]
name = "quantarena"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: full stack tests requiring docker compose",
    "benchmark: self-benchmark and ceiling tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
